<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEGA DISPLAY · Einrichtung</title>
<style>body{font:18px system-ui;background:#101a23;color:#e5f2fb;max-width:700px;margin:60px auto;padding:24px}h1{font-size:32px}label{display:block;margin:24px 0 8px}input,button{box-sizing:border-box;width:100%;padding:18px;border:1px solid #536b7d;border-radius:12px;background:#21313f;color:#e5f2fb;font:inherit}button{margin-top:30px;background:#276978}p{line-height:1.6;color:#b6cedd}#status{white-space:pre-wrap}</style>
<h1>MEGA DISPLAY</h1><p>Lokale Einrichtung. Der Gemini-Key wird nur auf dem Display gespeichert und vom Server für Google verwendet. Leere Key-Eingabe behält einen bereits gespeicherten Key.</p>
<form id="form"><label for="key">Gemini API-Key</label><input id="key" type="password" autocomplete="off" placeholder="Key aus Google AI Studio"><label for="model">Gemini Live-Modell</label><input id="model" value="gemini-3.8-live"><label for="home">Home Assistant URL</label><input id="home" type="url"><label for="astra">Astra URL</label><input id="astra" type="url"><button>Speichern</button></form><p id="status"></p>
<script>const $=id=>document.getElementById(id);fetch('/settings/status').then(r=>r.json()).then(data=>{$('model').value=data.geminiModel;$('home').value=data.tabs.find(t=>t.id==='home').url;$('astra').value=data.tabs.find(t=>t.id==='astra').url;$('status').textContent=data.geminiConfigured?'Gemini-Key gespeichert.':'Gemini-Key fehlt noch.';});$('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({geminiKey:$('key').value,geminiModel:$('model').value,homeUrl:$('home').value,astraUrl:$('astra').value})});const result=await r.json();$('key').value='';$('status').textContent=result.ok?'Gespeichert. Die Sprachverbindung wird erst mit dem Mikrofonknopf auf dem Display gestartet.':result.error;};</script></html>
