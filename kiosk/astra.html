<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astra · Anschluss vorbereitet</title><style>body{margin:0;min-height:100vh;display:grid;place-content:center;background:radial-gradient(ellipse at top,#1c364b,#0a111a 70%);color:#e4f3fb;font:24px system-ui;text-align:center;cursor:none}h1{font-size:80px;font-weight:300;margin:20px}p{color:#a7c0d1;max-width:720px;line-height:1.5}#clock{font-size:100px;font-weight:200}small{font-size:18px;color:#88a7be}</style><div id="clock"></div><h1 id="greeting"></h1><p>Der Platz für Astra ist vorbereitet.</p><small>Zum Verbinden wird noch die URL deiner Astra-Oberfläche benötigt.</small><script>function tick(){const date=new Date();document.getElementById('clock').textContent=date.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});const hour=date.getHours();document.getElementById('greeting').textContent=hour<11?'Guten Morgen':hour<18?'Guten Tag':'Guten Abend';}tick();setInterval(tick,10000);</script></html>
